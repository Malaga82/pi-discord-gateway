name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        include:
          # Windows parity watchdog: the code has win32-specific branches (.cmd
          # shim resolution, kill semantics, SIGBREAK, APPDATA paths) but the
          # suite still has Windows-only failures. Non-blocking until green.
          - os: windows-latest
            node-version: 22

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

      - name: CLI smoke test
        run: node dist/cli/index.js help

      - name: Package dry-run
        run: npm pack --dry-run
